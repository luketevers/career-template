<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{PAGE_TITLE}}</title>
    <style>
{{STYLE}}
    </style>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <h1>{{NAME}}</h1>
        <div class="subline">
          <span class="role">{{TITLE}}</span>
          <span class="contact">{{CONTACT}}</span>
        </div>
      </header>

      <p class="summary">{{SUMMARY}}</p>

      <div class="columns">
        <main>
          <h4>Experience</h4>
          {{EXPERIENCE}}
        </main>
        <aside>
          <h4>Skills</h4>
          {{SKILLS}}
          {{PROJECTS}}
          {{EDUCATION}}
        </aside>
      </div>
    </div>
  </body>
</html>
