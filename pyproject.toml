[project]
name = "career-engine"
version = "0.1.0"
description = "Engine scripts for the career template: resume build, render checks, season lifecycle"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Orphan-line detection in render_check needs PDF text extraction.
# Page-count checking works without it.
checks = ["pdfminer.six>=20221105"]
dev = ["pytest>=8.0", "pdfminer.six>=20221105"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# engine/ is a directory of scripts run as `python3 engine/<name>.py`, not an
# importable package. This pyproject exists as the dependency manifest
# (`pip install -e ".[dev]"`), so tell setuptools there is nothing to package
# rather than letting auto-discovery choke on the flat repo layout.
[tool.setuptools]
packages = []
